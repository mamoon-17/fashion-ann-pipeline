stages:
  prepare:
    cmd: python src/prepare.py
    deps: [src/prepare.py, requirements.txt]
    outs: [data/raw]
  train:
    cmd: python src/train.py
    deps: [src/train.py, data/processed]
    params: [train.dense_units, train.dropout_rate, train.learning_rate, 
        train.epochs, train.batch_size, train.seed]
    outs: [models]
  evaluate:
    cmd: python src/evaluate.py
    deps: [src/evaluate.py, models/model.h5, data/processed/test.npz]
    params: [train.batch_size]
    outs: [reports/evaluation]
    metrics:
    - metrics.json:
        cache: false
